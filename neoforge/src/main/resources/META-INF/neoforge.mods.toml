modLoader = "javafml"
loaderVersion = "[11,)"
license = "MIT"
issueTrackerURL = "https://github.com/fimkov/echoes-beneath/issues"

[[mods]]
modId = "echoes_beneath"
version = "${version}"
displayName = "Echoes Beneath"
description = '''
Record a place with an Echo Lens: its blocks, the creatures moving through it, and the real
sounds that played there. Come back later and stand inside that memory. The world goes near
black, remembered shapes are silhouettes, and every old sound returns at its own moment as a
wave that briefly lights the surfaces it touches. Tune the lens at a Resonance Table, trim a memory and adjust its volume at a Sounding Table,
and press its sound into an Echo Record for a jukebox. The lens remembers shape and sound, but not light.
'''
authors = "fimkov"
iconFile = "icon.png"

[[mixins]]
config = "echoes_beneath.mixins.json"

[[mixins]]
config = "echoes_beneath.client.mixins.json"

[[dependencies.echoes_beneath]]
modId = "neoforge"
type = "required"
versionRange = "[26.2.0.69,26.3)"
ordering = "NONE"
side = "BOTH"

[[dependencies.echoes_beneath]]
modId = "minecraft"
type = "required"
versionRange = "[26.2]"
ordering = "NONE"
side = "BOTH"
