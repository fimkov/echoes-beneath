plugins {
    id 'java'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = rootProject.mod_version
group = rootProject.maven_group

base {
    archivesName = "${rootProject.archives_base_name}-neoforge-${rootProject.minecraft_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = rootProject.neoforge_version
    accessTransformers.from file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client {
            client()
            programArguments.addAll '--username', 'fimkov'
        }
        server {
            server()
        }
    }
    mods {
        echoes_beneath {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', '../src/main/java', '../src/client/java']
            exclude 'dev/fimkov/echoesbeneath/platform/fabric/**'
            exclude 'dev/fimkov/echoesbeneath/client/platform/fabric/**'
            exclude 'dev/fimkov/echoesbeneath/datagen/**'
            exclude 'dev/fimkov/echoesbeneath/EchoesBeneathFabric.java'
            exclude 'dev/fimkov/echoesbeneath/client/EchoesBeneathClient.java'
        }
        resources {
            srcDirs = ['src/main/resources', '../src/main/resources', '../src/client/resources', '../src/main/generated']
            exclude 'fabric.mod.json'
            exclude 'echoes_beneath.accesswidener'
            exclude '.cache/**'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    def modVersion = project.version
    inputs.property "version", modVersion

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": modVersion
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "LICENSE_${rootProject.name}" }
    }
}
